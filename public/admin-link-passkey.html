<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Passkey Link - Arc Wallet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
    }
    h1 { margin-bottom: 8px; font-size: 24px; }
    .subtitle { color: #888; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; color: #aaa; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #4f46e5; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #4f46e5;
      color: #fff;
    }
    .btn-primary:hover { background: #4338ca; }
    .btn-primary:disabled {
      background: #333;
      cursor: not-allowed;
    }
    .status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.success {
      display: block;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #22c55e;
    }
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }
    .status.info {
      display: block;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #3b82f6;
    }
    .result-details {
      margin-top: 12px;
      padding: 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
    }
    .warning {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #f59e0b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admin Passkey Link</h1>
    <p class="subtitle">Link your existing passkey to your admin account</p>

    <div class="warning">
      This tool links your Mac passkey to your admin account without creating a new one.
      Only use this if you have an existing passkey that needs to be re-registered.
    </div>

    <div class="form-group">
      <label>Admin Email</label>
      <input type="email" id="email" value="sehereroglu786@gmail.com" />
    </div>

    <div class="form-group">
      <label>Admin Secret</label>
      <input type="password" id="adminSecret" value="arc-admin-2024-secret" />
    </div>

    <button class="btn-primary" id="linkBtn" onclick="linkPasskey()">
      Link Passkey
    </button>

    <div class="status" id="status"></div>
  </div>

  <script>
    const API_BASE = 'https://arcwallet-backend.onrender.com';

    function showStatus(message, type, details = null) {
      const status = document.getElementById('status');
      status.className = 'status ' + type;
      status.innerHTML = message;
      if (details) {
        status.innerHTML += '<div class="result-details">' + JSON.stringify(details, null, 2) + '</div>';
      }
    }

    async function linkPasskey() {
      const email = document.getElementById('email').value.trim();
      const adminSecret = document.getElementById('adminSecret').value;
      const btn = document.getElementById('linkBtn');

      if (!email || !adminSecret) {
        showStatus('Please fill in all fields', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Starting...';

      try {
        // Step 1: Start the linking process
        showStatus('Starting passkey link process...', 'info');

        const startRes = await fetch(API_BASE + '/passkeys/admin/link-passkey/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminSecret, email })
        });

        const startData = await startRes.json();
        if (!startData.success) {
          throw new Error(startData.error || 'Failed to start linking');
        }

        const options = startData.data.options;
        showStatus('Select your passkey from the prompt...', 'info');

        // Step 2: Call WebAuthn to get the credential
        btn.textContent = 'Waiting for passkey...';

        // Convert challenge from base64url to ArrayBuffer
        const challenge = base64urlToBuffer(options.challenge);

        const credential = await navigator.credentials.get({
          publicKey: {
            challenge,
            rpId: options.rpId,
            timeout: options.timeout || 60000,
            userVerification: options.userVerification || 'preferred',
            // Empty allowCredentials for discoverable credential mode
            allowCredentials: []
          }
        });

        if (!credential) {
          throw new Error('No credential returned');
        }

        showStatus('Passkey selected! Registering...', 'info');
        btn.textContent = 'Registering...';

        // Step 3: Send credential to server
        const credentialData = {
          id: credential.id,
          rawId: bufferToBase64url(credential.rawId),
          type: credential.type,
          response: {
            clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
            authenticatorData: bufferToBase64url(credential.response.authenticatorData),
            signature: bufferToBase64url(credential.response.signature),
            userHandle: credential.response.userHandle ? bufferToBase64url(credential.response.userHandle) : null
          }
        };

        const finishRes = await fetch(API_BASE + '/passkeys/admin/link-passkey/finish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ adminSecret, email, credential: credentialData })
        });

        const finishData = await finishRes.json();
        if (!finishData.success) {
          throw new Error(finishData.error || 'Failed to finish linking');
        }

        showStatus('Passkey successfully linked!', 'success', finishData.data);
        btn.textContent = 'Done!';

      } catch (error) {
        console.error('Error:', error);
        showStatus('Error: ' + error.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Link Passkey';
      }
    }

    // Helper functions
    function base64urlToBuffer(base64url) {
      const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
      const pad = base64.length % 4;
      const padded = pad ? base64 + '='.repeat(4 - pad) : base64;
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function bufferToBase64url(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }
  </script>
</body>
</html>
