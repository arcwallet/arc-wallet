services:
  - type: web
    name: arcwallet-backend
    rootDir: backend
    env: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    autoDeploy: true
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: RP_ID
        value: app.arcwallet.network
      - key: ORIGIN
        value: https://app.arcwallet.network
      - key: ALLOWED_ORIGINS
        value: https://app.arcwallet.network,https://arc-wallet.vercel.app
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: MAGIC_LINK_BASE_URL
        value: https://app.arcwallet.network
      - key: RP_NAME
        value: Arc Wallet

